<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weading-invitation</title>

    <!-- Gate images start downloading before the JS bundle even parses -->
    <link rel="preload" as="image" href="/letter-left.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/letter-right2.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/button.png" fetchpriority="high" />

    <!-- Fonts are referenced from CSS, so without these they only start
         downloading after the stylesheet parses -->
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/Manrope/Manrope-VariableFont_wght.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/Alex_Brush/AlexBrush-Regular.ttf"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
